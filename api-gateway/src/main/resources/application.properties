spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

#Actuator
management.endpoints.web.exposure.include=health

# Song Service Route
spring.cloud.gateway.server.webflux.routes[0].id=song-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SONG-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/songs/**

# Resource Service Route
spring.cloud.gateway.server.webflux.routes[1].id=resource-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://RESOURCE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/resources/**

#Eureka

# Eureka Server address
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=5
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5
# Prefer registering the service instance using its IP address rather than its hostname
eureka.instance.prefer-ip-address=true