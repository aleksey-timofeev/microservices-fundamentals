spring.application.name=config-server
server.port=${SERVER_PORT:8888}

#Actuator
management.endpoints.web.exposure.include=health

spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/aleksey-timofeev/microservices-fundamentals-config.git}
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true

#Eureka

# Eureka Server address
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=5
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5
# Prefer registering the service instance using its IP address rather than its hostname
eureka.instance.prefer-ip-address=true