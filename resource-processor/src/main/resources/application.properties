server.port=8085
spring.application.name=resource-processor

spring.cloud.function.definition=resourceUploaded
spring.cloud.stream.bindings.resourceUploaded-in-0.destination=${RESOURCE_UPLOADED_DESTINATION:resource-uploaded}
spring.cloud.stream.bindings.resourceUploaded-in-0.group=${RESOURCE_PROCESSOR_GROUP:resource-processor}
spring.cloud.stream.bindings.resourceUploaded-in-0.consumer.maxAttempts=${RESOURCE_PROCESSOR_MAX_ATTEMPTS:3}
spring.cloud.stream.bindings.resourceUploaded-in-0.consumer.backOffInitialInterval=${RESOURCE_PROCESSOR_RETRY_INITIAL_INTERVAL:1000}
spring.cloud.stream.bindings.resourceUploaded-in-0.consumer.backOffMaxInterval=${RESOURCE_PROCESSOR_RETRY_MAX_INTERVAL:5000}
spring.cloud.stream.bindings.resourceUploaded-in-0.consumer.backOffMultiplier=${RESOURCE_PROCESSOR_RETRY_MULTIPLIER:2.0}
spring.cloud.stream.rabbit.bindings.resourceUploaded-in-0.consumer.autoBindDlq=true
spring.cloud.stream.rabbit.bindings.resourceUploaded-in-0.consumer.republishToDlq=true

# rest
resource-service.rest-api.base-url=${RESOURCE_SERVICE_URL:http://localhost:8080}
song-service.rest-api.base-url=${SONG_SERVICE_URL:http://localhost:8080}

# Retries
resource-processor.http-retry.max-attempts=${RESOURCE_PROCESSOR_HTTP_MAX_ATTEMPTS:3}
resource-processor.http-retry.initial-interval=${RESOURCE_PROCESSOR_HTTP_RETRY_INITIAL_INTERVAL:200ms}
resource-processor.http-retry.max-interval=${RESOURCE_PROCESSOR_HTTP_RETRY_MAX_INTERVAL:1s}
resource-processor.http-retry.multiplier=${RESOURCE_PROCESSOR_HTTP_RETRY_MULTIPLIER:2.0}